<!--
THESIS: A six-channel mixing desk for a robot arm. Each joint is a channel strip whose meter shows where the joint is and where it was sent; it refuses Studio's grey round buttons floating over a 3D viewport.
OWN-WORLD: Matte charcoal anodised desk, printed uppercase legends, square backlit keys (amber held or moving, green motors on, red stop or fault), scribble-tape colour per joint, tabular readouts.
STORY: The maker sees at a glance whether the arm is live, nudges a joint or the tool by exact steps, watches the amber lead lights count the steps still to go and drain as the joint catches up, stages a pose by dragging joints and sends it with Move once the shadow arm shows it clear of the cart, and stops everything with one key.
FIRST VIEWPORT: Meter bridge across the top (link, state, hold-to-enable, oversized STOP at right); the 3D monitor of the arm standing on its cart, with a coloured ring at each joint and a plan bar docked along its bottom while a pose is staged, at left beside the six joint faders and master tool section on wide screens, and stacked above them below 1240 px (the app side panel); message line pinned along the bottom.
FORM: Candidate 6 of 7, mixing-console channel strips; staging: tension-commit (hold) for Enable; seed 86aed4aa.
-->
<style>
  :root {

    --panel: #222427;
    --seam: #33363b;

    --ink-2: #aaa69d;

    --cap-top: #3f444a;
    --cap-edge: #50565d;
    --amber: #f2aa3c;
    --amber-ink: #1d1304;
    --green: #5ec683;
    --red: #d63a2f;
    --red-deep: #9f2219;
    --alarm: #ff8073;
    --tape-1: #e3ba4f;
    --tape-2: #7fb3d9;
    --tape-3: #92cc8a;
    --tape-4: #e19769;
    --tape-5: #baa2dd;
    --tape-6: #dad5c9;
    --axis-x: #ff3352;
    --axis-y: #8bdc00;
    --axis-z: #2890ff;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 100vh;
    background: var(--desk);
    color: var(--ink);

  h1, h2, p { margin: 0; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .legend, .axis-group {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-2);
  }

  /* Keys: square caps lit from above; amber backlight only while held. */
  .key {
    display: grid;
    place-items: center;
    border: 1px solid var(--cap-edge);
    border-radius: 4px;
    background: linear-gradient(var(--cap-top), var(--cap));
    box-shadow: 0 2px 0 #0b0c0d, 0 3px 6px rgb(0 0 0 / 0.35);
    color: var(--ink);
    cursor: pointer;
    user-select: none;
    touch-action: none;
    transition: background-color 120ms var(--ease), box-shadow 120ms var(--ease), transform 120ms var(--ease);
  }
  .key:hover:not(:disabled) { background: linear-gradient(#4a5057, var(--cap-top)); }
  .key.held, .key:active:not(:disabled) {
    background: var(--amber);
    color: var(--amber-ink);
    box-shadow: 0 0 0 #0b0c0d, inset 0 2px 4px rgb(0 0 0 / 0.3);

  }
  .key.refused, .key.refused:hover:not(:disabled) {

  }
  .key:disabled { opacity: 0.38; cursor: not-allowed; box-shadow: none; }

  /* ---- Meter bridge: always on screen ---- */
  .bridge {
    position: sticky;
    top: 0;
    z-index: 10;
    display: grid;
    grid-template-columns: minmax(170px, 1fr) minmax(280px, 2fr) auto auto;
    grid-template-areas: "ident state enable stop";
    gap: 14px;
    align-items: stretch;
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--seam);

  }
  .ident { grid-area: ident; display: grid; align-content: center; gap: 6px; }
  .ident h1 { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
  .link { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
  .led { width: 9px; height: 9px; border-radius: 50%; background: #55595f; flex: none; }
  .led[data-on="live"] { background: var(--green); }
  .led[data-on="slow"] { background: #8f8b83; }
  .led[data-on="dead"] { background: var(--alarm); }

  .readout-window {
    grid-area: state;
    display: grid;
    align-content: center;
    gap: 4px;
    padding: 8px 14px;
    background: var(--well);
    border: 1px solid var(--seam);

    box-shadow: inset 0 2px 6px rgb(0 0 0 / 0.5);

  }
  .state-name { font-size: 26px; font-weight: 700; letter-spacing: 0.04em; line-height: 1.1; }
  .state-detail { color: var(--ink-2); font-size: 13px; }
  /* Lit state window. Each rung differs in brightness, not just hue:
     moving (lit amber) > alarm (solid red) > ready (lit green) > stopped (red tint) > motors off (dark). */
  .readout-window[data-tone="moving"] { background: var(--amber); border-color: #ffd08a; }
  .readout-window[data-tone="moving"] :is(.state-name, .state-detail) { color: var(--amber-ink); }
  .readout-window[data-tone="alarm"] { background: #c62f25; border-color: #ff8073; }
  .readout-window[data-tone="alarm"] :is(.state-name, .state-detail) { color: #fff; }
  .readout-window[data-tone="ready"] { background: #1a4a2d; border-color: #4f9c6b; }
  .readout-window[data-tone="ready"] .state-name { color: #a6efbf; }
  .readout-window[data-tone="ready"] .state-detail { color: #d3eedc; }
  .readout-window[data-tone="stopped"] { background: #2b100d; border-color: #8c2f26; }
  .readout-window[data-tone="stopped"] .state-name { color: var(--alarm); }
  .readout-window[data-tone="stopped"] .state-detail { color: #f3c3bd; }

  .enable {
    grid-area: enable;

    overflow: hidden;
    min-width: 150px;
    padding: 10px 14px;
    align-content: center;
    gap: 2px;
  }
  .enable .fill {
    position: absolute;
    inset: auto 0 0 0;
    height: 5px;
    background: var(--green);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 160ms var(--ease);
  }
  .enable.charging .fill { transform: scaleX(1); transition: transform 700ms linear; }
  .enable .label { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 650; }
  .enable .sub { font-size: 11px; color: var(--ink-2); letter-spacing: 0.02em; }
  .enable.on, .enable.on:hover:not(:disabled) { background: linear-gradient(#27452f, #1d3425); border-color: #3f8a5a; }
  .enable.on .label { color: #d9f5e2; }
  .enable.on .label .led { background: var(--green); }
  .enable.on .sub { color: #a9d8b8; }
  .enable.busy { cursor: progress; }

  .stop {
    grid-area: stop;
    min-width: 232px;
    padding: 8px 26px;
    border: 2px solid #ef5d50;
    border-radius: 6px;
    background: var(--red);
    color: #fff;
    box-shadow: 0 3px 0 #5f130d, 0 6px 14px rgb(0 0 0 / 0.45);
    cursor: pointer;
    display: grid;
    place-items: center;
    touch-action: none;
    transition: background-color 100ms var(--ease), transform 100ms var(--ease), box-shadow 100ms var(--ease);
  }
  .stop:hover { background: #e2453a; }
  .stop.fired, .stop:active { background: var(--red-deep); transform: translateY(3px); box-shadow: 0 0 0 #5f130d, inset 0 3px 6px rgb(0 0 0 / 0.35); }
  .stop .big { font-size: 36px; font-weight: 800; letter-spacing: 0.08em; line-height: 1; }
  .stop .sub { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; opacity: 0.92; }

  /* ---- Desk: the 3D monitor beside the joint faders and the tool section ---- */
  .desk {
    display: grid;
    grid-template-columns: minmax(400px, 1fr) minmax(0, 780px);
    grid-template-areas: "monitor joints" "monitor tool";
    grid-template-rows: auto 1fr;
    gap: 14px;
    padding: 14px 16px;
    align-items: stretch;
  }
  .monitor { grid-area: monitor; }
  .joints { grid-area: joints; }
  .tool { grid-area: tool; }
  .section {
    display: grid;
    grid-template-rows: auto 1fr;
    align-content: start;
    gap: 12px;
    padding: 12px;
    background: var(--panel);
    border: 1px solid var(--seam);
    border-radius: 6px;
  }
  .bank { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  .bank h2 { font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-right: 4px; }
  .latch {
    min-width: 46px;
    height: 30px;
    padding: 0 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-2);
  }
  /* Step and speed: short faders whose caps snap to the detents the server accepts. Each is a small channel:
     legend and value above a slot as wide as the channel, the range printed under its ends. The slot, cap and
     ticks follow the joint faders. Channels on one row are split by a seam; the clip hides the seam of a
     channel that wraps to the start of a row. */
  .joints .bank, .tool .bank { align-items: baseline; column-gap: 24px; clip-path: inset(-24px -3px); }
  .detent + .detent::before { content: ""; position: absolute; left: -12.5px; top: 0; bottom: 0; width: 1px; background: var(--seam); }
  .detent {
    position: relative;
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-areas: "legend value" "track track";
    align-items: baseline;
    row-gap: 1px;
    flex: 1 1 200px;
    min-width: 150px;
    max-width: 320px;
  }
  .detent .legend { grid-area: legend; line-height: 15px; }
  .detent-value { grid-area: value; justify-self: end; color: var(--ink); font-size: 13px; font-weight: 650; line-height: 15px; white-space: nowrap; }
  .detent-track { grid-area: track; position: relative; height: 30px; }
  .detent-track input {
    position: absolute;
    inset: 0 0 auto;
    width: 100%;
    height: 18px;
    margin: 0;
    background: transparent;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .detent-track input::-webkit-slider-runnable-track {
    height: 6px;
    background: var(--well);
    border: 1px solid var(--seam);
    border-radius: 3px;
    box-shadow: inset 0 1px 3px rgb(0 0 0 / 0.6);
  }
  .detent-track input::-moz-range-track {
    height: 6px;
    background: var(--well);
    border: 1px solid var(--seam);
    border-radius: 3px;
    box-shadow: inset 0 1px 3px rgb(0 0 0 / 0.6);
  }
  .detent-track input::-webkit-slider-thumb {
    width: 11px;
    height: 18px;
    margin-top: -6px;
    border: 0;
    border-radius: 2px;
    background: var(--detent-groove), linear-gradient(#f6f3ec, #cfcac0);
    box-shadow: 0 1px 3px rgb(0 0 0 / 0.7);
    -webkit-appearance: none;
    appearance: none;
  }
  .detent-track input::-moz-range-thumb {
    width: 11px;
    height: 18px;
    border: 0;
    border-radius: 2px;
    background: var(--detent-groove), linear-gradient(#f6f3ec, #cfcac0);
    box-shadow: 0 1px 3px rgb(0 0 0 / 0.7);
  }
  .detent-track { --detent-groove: linear-gradient(90deg, transparent 5px, rgb(0 0 0 / 0.45) 5px 6px, transparent 6px); }
  .detent-track input:is(:hover, :active)::-webkit-slider-thumb { background: var(--detent-groove), linear-gradient(#ffffff, #e4dfd5); }
  .detent-track input:is(:hover, :active)::-moz-range-thumb { background: var(--detent-groove), linear-gradient(#ffffff, #e4dfd5); }
  /* Focus rings the slot itself, clear of the value above and the figures below; the cap rides over it. The
     transparent outline shows in the system colour in Windows High Contrast, which drops the ring's shadow. */
  .detent-track input:focus-visible { outline: 2px solid transparent; outline-offset: 0; }
  .detent-track input:focus-visible::-webkit-slider-runnable-track { box-shadow: inset 0 1px 3px rgb(0 0 0 / 0.6), 0 0 0 2px var(--ink); }
  .detent-track input:focus-visible::-moz-range-track { box-shadow: inset 0 1px 3px rgb(0 0 0 / 0.6), 0 0 0 2px var(--ink); }
  .detent-ticks { position: absolute; left: 5.5px; right: 5.5px; top: 14px; height: 4px; pointer-events: none; }
  .detent-ticks i { position: absolute; top: 0; width: 1px; height: 4px; margin-left: -0.5px; background: #7a7f87; }
  /* The slow default the speeds start from each time the panel opens, printed like a desk's unity mark. */
  .detent-ticks i.home { height: 6px; background: #8f8b83; }
  .detent-ends {
    position: absolute;
    left: 0;
    right: 0;
    top: 18px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    color: #8f8b83;
    font-size: 10px;
    line-height: 12px;
    white-space: nowrap;
    pointer-events: none;
  }
  .detent-note { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* The redline: speeds that could move the tool faster than 250 mm/s, printed like a speedometer's red zone. A
     2px rule runs along the ticks' feet from the line to the top of the scale, clear of the focus ring; the ticks
     past it, the line's own figure and the top figure are red, and so is the value while the cap sits past it. */
  .detent-red { position: absolute; top: 2px; right: 0; height: 2px; background: var(--alarm); }
  .detent-ticks i.over { background: var(--alarm); }
  .detent-value.over, .detent-ends .over, .detent-line { color: var(--alarm); }
  .detent-line { position: absolute; top: 0; transform: translateX(-50%); }
  /* Windows High Contrast drops gradients and shadows, so the caps, ticks and seams take system colours there. */
  @media (forced-colors: active) {
    .detent-track input::-webkit-slider-thumb,
    .detent-track input:is(:hover, :active)::-webkit-slider-thumb { forced-color-adjust: none; background: ButtonText; }
    .detent-track input::-moz-range-thumb,
    .detent-track input:is(:hover, :active)::-moz-range-thumb { forced-color-adjust: none; background: ButtonText; }
    .detent-ticks i, .detent + .detent::before { forced-color-adjust: none; background: GrayText; }
    .detent-ticks i.home { background: CanvasText; }
    .detent-red, .detent-ticks i.over { forced-color-adjust: none; background: Highlight; }
    .detent-value.over, .detent-ends .over, .detent-line { forced-color-adjust: none; color: Highlight; }
  }
  /* Legends: each swatch keeps its label; on a narrow bank the items wrap whole, flush right. */
  .meter-key { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 4px 14px; margin-left: auto; color: var(--ink-2); font-size: 12px; }
  .meter-key .item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .swatch { display: inline-block; width: 18px; height: 6px; border-radius: 1px; }
  .swatch.now { background: var(--ink); }
  .swatch.goal { border: 2px solid var(--amber); height: 8px; }
  .swatch.goal.planned { border-style: dashed; }
  .swatch.lead { width: 7px; height: 12px; background: var(--amber); }
  .swatch.ring { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--tape-2); }
  /* The tool gizmo's sample: a 2px ring in its three axis colours, kept in Windows High Contrast, like the 3D view. */
  .swatch.gizmo {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: conic-gradient(var(--axis-x) 0 120deg, var(--axis-y) 0 240deg, var(--axis-z) 0);
    -webkit-mask: radial-gradient(circle, transparent 3.5px, #000 4px);
    mask: radial-gradient(circle, transparent 3.5px, #000 4px);
    forced-color-adjust: none;
  }
  .swatch.shadow, .swatch.blocked { width: 14px; height: 10px; }
  .swatch.shadow { background: rgb(242 170 60 / 0.45); border: 1px solid var(--amber); }
  .swatch.blocked { background: rgb(255 128 115 / 0.4); border: 1px solid var(--alarm); }

  /* ---- 3D monitor: a sunk screen in the desk ---- */
  .monitor { grid-template-rows: auto 1fr; align-content: stretch; }
  .view-reset { margin-left: 4px; }
  /* What dragging in the 3D view moves: two interlocked keys, like a desk's source selector. The one in use stays
     pressed in with its legend in Legend Ink; the other stands up, printed grey. */
  .mode-keys { display: inline-flex; }
  .mode-key { min-width: 58px; }
  .mode-key:first-child { border-radius: 4px 0 0 4px; }
  .mode-key:last-child { border-left-width: 0; border-radius: 0 4px 4px 0; }
  /* Pressed in: the face sinks inside a rim that stays put, so the joined block keeps a straight outline. */
  .mode-key[aria-pressed="true"], .mode-key[aria-pressed="true"]:hover:not(:disabled) {
    background: linear-gradient(#25282c, #2d3136);
    box-shadow: inset 0 2px 4px rgb(0 0 0 / 0.5);
    color: var(--ink);
    padding-top: 4px;
  }
  .screen {
    position: relative;
    min-height: 420px;
    overflow: hidden;
    background: var(--well);
    border: 1px solid var(--seam);
    border-radius: 4px;
    box-shadow: inset 0 2px 6px rgb(0 0 0 / 0.5);
  }
  .screen-canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .screen-note {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    color: var(--ink-2);
    font-size: 14px;
    text-align: center;
  }
  .screen-help {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 9px;
    color: #9a968d;
    font-size: 12px;
    pointer-events: none;
  }
  /* Readout that follows a drag, set outward from the ring so it never covers the ring or its arc. */
  .screen-tag {
    position: absolute;
    z-index: 4;
    padding: 6px 9px;
    background: rgb(14 15 16 / 0.94);
    border: 1px solid var(--amber);
    border-radius: 3px;
    box-shadow: 0 4px 10px rgb(0 0 0 / 0.45);
    color: var(--ink);
    font-size: 13px;
    line-height: 1.35;
    white-space: nowrap;
    pointer-events: none;
  }
  .screen-tag .to { color: var(--amber); font-weight: 650; }
  .screen-tag .how { display: block; color: var(--ink-2); font-size: 11px; }
  .screen-tag[data-tone="blocked"] { border-color: var(--alarm); }
  .screen-tag[data-tone="blocked"] :is(.to, .how) { color: var(--alarm); }

  /* Plan bar: the staged pose, docked along the bottom of the screen until it's sent or cleared. The chips
     and note wrap in the middle; Clear and Move stay together at the right. */
  .plan {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 10px;
    z-index: 3;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 8px 12px;
    padding: 8px 10px;
    background: rgb(24 25 27 / 0.95);
    border: 1px solid var(--seam);
    border-radius: 4px;
    box-shadow: 0 4px 12px rgb(0 0 0 / 0.45);
  }
  .plan-body { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; min-width: 0; }
  .plan-keys { display: flex; align-items: center; gap: 8px; }
  .plan-joints { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .plan-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 2px 3px 4px 3px;
    background: var(--well);
    border: 1px solid var(--seam);
    border-radius: 3px;
    font-size: 13px;
    white-space: nowrap;
  }
  .plan-chip .tag {
    padding: 1px 5px;
    background: var(--tape);
    color: #15161a;
    border-radius: 2px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  /* The × that takes a joint out of the plan is a small key cap like any other. */
  .plan-chip .unstage { width: 24px; height: 22px; padding: 0; border-radius: 3px; color: var(--ink-2); font-size: 15px; line-height: 1; }
  .plan-chip .unstage:hover { color: var(--ink); }
  .plan-note { flex: 1 1 180px; color: var(--ink-2); font-size: 12px; }
  .plan.blocked .plan-note { color: var(--alarm); font-weight: 600; }
  .plan.over .plan-note { color: var(--alarm); }
  .plan .latch { height: 36px; }
  /* Move: an amber lamp along its lower edge says a plan is ready to go. When it can't go, it stays pressable
     but unlit, and a press is refused with the reason on the message line. */
  .plan-move {
    min-width: 104px;
    height: 40px;
    padding: 0 18px;
    color: var(--amber);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-color: #8a6420;
    box-shadow: inset 0 -3px 0 var(--amber), 0 2px 0 #0b0c0d;
  }
  .plan-move[aria-disabled="true"] { color: var(--ink-2); border-color: var(--cap-edge); box-shadow: 0 2px 0 #0b0c0d, 0 3px 6px rgb(0 0 0 / 0.35); }
  .plan-move[aria-disabled="true"]:active {
    background: linear-gradient(var(--cap-top), var(--cap));
    color: var(--ink-2);
    box-shadow: 0 0 0 #0b0c0d, inset 0 2px 4px rgb(0 0 0 / 0.3);
  }
  .plan-move:disabled { color: var(--ink-2); border-color: var(--cap-edge); box-shadow: none; }
  .plan-move.refused { color: var(--alarm); border-color: var(--cap-edge); box-shadow: inset 0 0 0 2px var(--alarm); }
  /* On a wide, short screen (the stacked side panel) the 3D view frames the arm in the full height and leaves
     a column at the right (arm_view.js sets data-shape): the plan bar and help line dock there. */
  .screen[data-shape="wide"] .plan { left: auto; width: 248px; grid-template-columns: minmax(0, 1fr); }
  .screen[data-shape="wide"] .plan-keys { justify-content: flex-end; }
  .screen[data-shape="wide"] .screen-help { left: auto; width: 248px; }

  .strips { display: grid; grid-template-columns: repeat(6, minmax(96px, 1fr)); gap: 8px; }
  .strip {
    --tape: var(--tape-1);
    display: grid;
    grid-template-rows: auto 46px clamp(170px, 22vh, 280px) 46px auto auto;
    align-content: start;
    gap: 8px;
    padding: 8px;
    background: #1b1d20;
    border: 1px solid var(--seam);
    border-radius: 4px;
  }
  /* Scribble strip: a length of coloured tape across the top of the channel. */
  .scribble {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    padding: 4px 7px;
    background: var(--tape);
    color: #15161a;
    border-radius: 2px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .scribble .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scribble .act { width: 8px; height: 8px; border-radius: 50%; margin-left: auto; flex: none; background: rgb(21 22 26 / 0.35); }
  .strip.moving .scribble .act { background: #15161a; box-shadow: 0 0 0 2px var(--amber); }
  .strip .key { font-size: 24px; font-weight: 500; }
  .meters { display: grid; grid-template-columns: minmax(0, 1fr) 30px; gap: 4px; min-height: 0; }

  .meter {
    position: relative;
    background:
      linear-gradient(var(--seam), var(--seam)) 50% 50% / 100% 1px no-repeat,
      repeating-linear-gradient(to bottom, #2a2d31 0 1px, transparent 1px calc(100% / 12)) 0 0 / 22% 100% no-repeat,
      repeating-linear-gradient(to bottom, #2a2d31 0 1px, transparent 1px calc(100% / 12)) 100% 0 / 22% 100% no-repeat,
      var(--well);
    border: 1px solid var(--seam);
    border-radius: 3px;
    box-shadow: inset 0 2px 5px rgb(0 0 0 / 0.45);
    overflow: hidden;
    touch-action: none;
  }
  /* The fader cap can be grabbed and dragged to a new angle. */
  .meter.near-cap { cursor: grab; }
  .strip.dragging .meter { cursor: grabbing; }
  .meter.near-cap .mark.now, .strip.dragging .mark.now { background: linear-gradient(#ffffff, #e4dfd5); }
  /* A staged angle isn't commanded yet: a dashed frame and a grey target line until Move sends it. */
  .mark.goal.planned { border-style: dashed; }
  .strip .toward.planned { color: var(--ink-2); }
  .mark.goal.blocked { border-color: var(--alarm); }
  .strip .toward.blocked { color: var(--alarm); }
  .meter .scale {
    position: absolute;
    left: 4px;
    font-size: 10px;
    color: #8f8b83;
    transform: translateY(-50%);
    pointer-events: none;
  }
  /* Lit column from 0 deg to the joint's actual angle, revealed with clip-path. */
  .meter .lit {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 42%;
    right: 42%;
    background: color-mix(in srgb, var(--tape) 55%, transparent);
    clip-path: inset(50% 0 50% 0);
    transition: clip-path 140ms var(--ease);
  }
  .mark {
    position: absolute;
    left: 24%;
    right: 24%;
    transform: translateY(-50%);
    transition: top 140ms var(--ease);
  }
  /* Fader-cap marker for the actual angle, with a centre groove. */
  .mark.now {
    height: 9px;
    border-radius: 2px;
    background: linear-gradient(#f6f3ec, #cfcac0);
    box-shadow: 0 1px 3px rgb(0 0 0 / 0.7);
  }
  .mark.now::after { content: ""; position: absolute; left: 3px; right: 3px; top: 4px; height: 1px; background: rgb(0 0 0 / 0.45); }
  .mark.goal { height: 13px; border: 2px solid var(--amber); border-radius: 2px; }
  .mark.over::before { content: ""; position: absolute; inset: -5px 30% auto; border-top: 2px solid var(--alarm); }

  /* Lead lights: an LED ladder counting how far the commanded goal is ahead of the joint,
     four lights per step, lit outward from the centre line (up for +, down for -). */
  .lead {
    display: flex;
    flex-direction: column;
    padding: 4px 5px;
    background: var(--well);
    border: 1px solid var(--seam);
    border-radius: 3px;
    box-shadow: inset 0 2px 5px rgb(0 0 0 / 0.45);
  }
  .lead .half, .lead .step { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .lead .half { gap: 5px; }
  .lead .step { gap: 2px; }
  .lead i { flex: 1; min-height: 2px; border-radius: 1px; background: #25282c; transition: background-color 80ms linear; }
  .lead i.on { background: var(--amber); }
  .lead .zero { flex: none; height: 2px; margin: 4px -5px; background: var(--ink-2); }

  .value { font-size: 20px; font-weight: 650; text-align: center; letter-spacing: -0.01em; }
  .strip.moving .value { color: var(--amber); }
  .strip .toward { min-height: 20px; margin-top: -6px; font-size: 15px; font-weight: 650; color: var(--amber); text-align: center; }

  .axes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(4, auto); grid-auto-flow: column; gap: 8px; align-content: start; }
  .axis-group { margin: 4px 0 -2px; }
  .axis {
    display: grid;
    grid-template-columns: 58px 50px minmax(0, 1fr) 50px;
    gap: 8px;
    align-items: center;
    padding: 6px 8px;
    background: #1b1d20;
    border: 1px solid var(--seam);
    border-radius: 4px;
  }
  .axis .key { height: 44px; font-size: 22px; }
  .axis .reading { position: relative; display: grid; justify-items: center; }
  .axis .reading .value { font-size: 19px; }
  .axis .reading .toward { position: absolute; top: 100%; left: 0; right: 0; text-align: center; font-size: 11px; line-height: 1.1; color: var(--amber); }
  .axis .reading .toward.planned { color: var(--ink-2); }
  .axis.moving .reading .value { color: var(--amber); }
  .axis .axis-name { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

  /* ---- Console line ---- */
  .console-line {
    position: sticky;
    bottom: 0;
    z-index: 9;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 6px 16px;
    padding: 9px 16px;
    background: var(--well);
    border-top: 1px solid var(--seam);
    font-size: 13px;
  }
  #note[data-tone="ok"] { color: var(--ink); }
  #note[data-tone="wait"] { color: var(--amber); }
  #note[data-tone="bad"] { color: var(--alarm); font-weight: 600; }
  .hint { color: var(--ink-2); }

  @media (max-width: 1240px) {
    .desk { grid-template-columns: minmax(0, 1fr); grid-template-areas: "monitor" "joints" "tool"; grid-template-rows: none; }
    /* Short enough that the fader readouts still land in the first screenful of an app side panel. */
    .screen { min-height: 0; height: clamp(300px, 36vh, 500px); }
  }
  /* Side by side, the monitor stays in view between the bridge and the message line while the right column scrolls. */
  @media (min-width: 1241px) {
    .monitor { position: sticky; top: 110px; align-self: start; height: max(460px, calc(100vh - 166px)); }
  }
  @media (max-width: 860px) {
    .bridge { grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "ident enable stop" "state state state"; }
    .strips { grid-template-columns: repeat(3, minmax(92px, 1fr)); }
  }
  @media (max-width: 560px) {
    .axes { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-flow: row; }
    .joints .bank h2, .tool .bank h2, .detent { flex-basis: 100%; max-width: none; }
    /* Tall enough that the tool gizmo fits above a staged plan's bar, short enough that the bar's Move key stays
       above the message line on a phone. */
    .screen { height: clamp(360px, 50vh, 500px); }
    .bridge { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "state stop" "ident enable"; gap: 8px; padding: 8px; }
    .stop { min-width: 112px; padding: 6px 10px; }
    .stop .big { font-size: 26px; }
    .enable { min-width: 0; }
    .state-name { font-size: 20px; }
    .meters { grid-template-columns: minmax(0, 1fr) 22px; gap: 3px; }
    .lead { padding: 3px; }
    .lead .zero { margin: 3px -3px; }
  }
  /* Two-line scribble tape whenever the fader bank is too narrow for the full joint names on one line. */
  .strips { container-type: inline-size; }
  @container (max-width: 760px) {
    .scribble { flex-wrap: wrap; row-gap: 1px; font-size: 11px; letter-spacing: 0.02em; }
    .scribble .name { order: 3; flex-basis: 100%; }
  }
  /* On a narrow screen the plan drops its title and each chip's from-angle (the strips still show it), its
     joints take the full width, and the note sits beside the keys, so the bar stays low over the arm. */
  .screen { container-type: inline-size; }
  @container (max-width: 520px) {
    .plan { grid-template-columns: minmax(0, 1fr) auto; }
    .plan-title { display: none; }
    .plan-body { display: contents; }
    .plan-joints { grid-column: 1 / -1; }
    .plan-chip .from { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<header class="bridge">
  <div class="ident">
    <h1>Jog panel</h1>
    <p class="link"><span class="led" id="linkLed"></span><span id="linkText">Connecting…</span></p>
  </div>
  <div class="readout-window" id="stateWindow" data-tone="idle" aria-live="polite">
    <p class="state-name" id="stateName">CONNECTING</p>
    <p class="state-detail" id="stateDetail">Waiting for the jog panel server.</p>
  </div>
  <button class="key enable" id="enableKey" type="button" disabled
          aria-label="Hold to switch the motors on" aria-describedby="enableSub">
    <span class="label"><span class="led"></span><span id="enableLabel">Hold to enable</span></span>
    <span class="sub" id="enableSub">Hold for 0.7 s</span>
    <span class="fill"></span>
  </button>
  <button class="stop" id="stopKey" type="button" aria-keyshortcuts="Space Escape">
    <span class="big">STOP</span>
    <span class="sub">Space or Esc</span>
  </button>
</header>

<main class="desk">
  <section class="section monitor" aria-labelledby="armTitle">
    <div class="bank">
      <h2 id="armTitle">Arm</h2>
      <div class="mode-keys" role="group" aria-label="Dragging in the 3D view moves">
        <button class="key latch mode-key" id="modeJoints" type="button" aria-pressed="true">Joints</button>
        <button class="key latch mode-key" id="modeTool" type="button" aria-pressed="false">Tool</button>
      </div>
      <p class="meter-key"><span class="item"><span class="swatch ring" id="dragSwatch"></span><span id="dragLegend">drag a ring</span></span> <span class="item"><span class="swatch shadow"></span>plan</span> <span class="item"><span class="swatch blocked"></span>blocked</span></p>
      <button class="key latch view-reset" id="viewReset" type="button">Reset view</button>
    </div>
    <div class="screen" id="screen">
      <p class="screen-note" id="screenNote">Loading the arm model…</p>
      <p class="screen-tag" id="screenTag" hidden></p>
      <p class="screen-help" id="screenHelp" hidden></p>
      <div class="plan" id="plan" role="group" aria-label="Plan" hidden>
        <p class="legend plan-title">Plan</p>
        <div class="plan-body">
          <ul class="plan-joints" id="planJoints" aria-label="Planned joints"></ul>
          <p class="plan-note" id="planNote" role="status"></p>
        </div>
        <div class="plan-keys">
          <button class="key latch" id="planClear" type="button">Clear</button>
          <button class="key plan-move" id="planMove" type="button">Move</button>
        </div>
      </div>
    </div>
  </section>

  <section class="section joints" aria-labelledby="jointsTitle">
    <div class="bank">
      <h2 id="jointsTitle">Joints</h2>
      <div class="detent" data-setting="jointStep" data-label="Step" data-unit="°" data-name="Joint step"></div>
      <div class="detent" data-setting="jointSpeed" data-label="Speed" data-unit="°/s" data-name="Joint speed"></div>
      <p class="meter-key"><span class="item"><span class="swatch now"></span>actual</span> <span class="item"><span class="swatch goal"></span>commanded</span> <span class="item"><span class="swatch goal planned"></span>planned</span> <span class="item"><span class="swatch lead"></span>steps ahead</span></p>
    </div>
    <div class="strips" id="strips"></div>
  </section>

  <section class="section tool" aria-labelledby="toolTitle">
    <div class="bank">
      <h2 id="toolTitle">Tool</h2>
      <div class="detent" data-setting="toolStep" data-label="Step" data-unit=" mm" data-name="Tool step"></div>
      <div class="detent" data-setting="rotStep" data-label="Turn" data-unit="°" data-name="Tool turn step"></div>
      <div class="detent" data-setting="toolSpeed" data-label="Speed" data-unit=" mm/s" data-name="Tool speed"></div>
    </div>
    <div class="axes" id="axes"></div>
  </section>
</main>

<footer class="console-line">
  <span id="note" data-tone="ok" role="status">Starting…</span>
  <span class="hint" id="hint"></span>
</footer>

<script>
"use strict";
const TOKEN = "__TOKEN__";
const CONFIG = __CONFIG__;
const JOINT_NAMES = ["Base", "Shoulder", "Elbow", "Wrist 1", "Wrist 2", "Flange"];
const TOOL_AXES = [
  {name: "X", unit: "mm"}, {name: "Y", unit: "mm"}, {name: "Z", unit: "mm"},
  {name: "Roll", unit: "°"}, {name: "Pitch", unit: "°"}, {name: "Yaw", unit: "°"},
];
const CHOICES = {
  jointStep: CONFIG.jointSteps, jointSpeed: CONFIG.jointSpeeds,
  toolStep: CONFIG.toolSteps, rotStep: CONFIG.rotSteps, toolSpeed: CONFIG.toolSpeeds,
};
// Steps are remembered on this PC; the speeds start slow every time the panel opens.
const REMEMBERED = ["jointStep", "toolStep", "rotStep"];
const HOLD_TO_ENABLE_MS = 700;
const REPEAT_DELAY_MS = 400;
const REPEAT_EVERY_MS = 250;
const POLL_MS = 150;
const MAX_WAITING_PRESSES = 2;
const LEDS_PER_STEP = 4;

const $ = (id) => document.getElementById(id);
const settings = loadSettings();
const releases = [];
const strips = [];
const axes = [];
let status = null;
let canJog = false;
let lastServerNote = null;
let localStopAlarm = false;
let settled = false;  // false until the first status arrives or polling has clearly failed
let view = null;  // the 3D monitor, once it has loaded
let fader = null;  // a fader-cap drag in progress
let preview = null;  // {joint, to, clear} from a ring or fader drag, or {pose, clear} from a gizmo drag
let plan = null;  // staged targets per joint (deg, or null to stay with the real arm), built by dragging
let planCheck = {clear: true, hit: null};  // whether the move from the arm to the plan stays clear, else what it hits
let planSending = false;
let planSentAt = 0;  // when the plan was sent; it stays on screen until the status shows it as the goal
let kinematics = null;  // ik.js's forward kinematics, for the tool rows' planned pose
let dragMode = "joints";  // what dragging in the 3D view moves: "joints" (a ring each) or "tool" (the gizmo)
try { if (localStorage.getItem("jogPanelDrag") === "tool") dragMode = "tool"; } catch (e) { /* private mode */ }
const DRAG_SNAP_DEG = 0.5;
const DRAG_MIN_DEG = 0.25;  // a shorter drag is a click, not a change to the plan
const CAP_GRAB_PX = 14;

function loadSettings() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("jogPanel") || "{}") || {}; } catch (e) { saved = {}; }
  const out = {};
  for (const key of Object.keys(CHOICES)) {
    out[key] = REMEMBERED.includes(key) && CHOICES[key].includes(saved[key]) ? saved[key] : CONFIG.defaults[key];
  }
  return out;
}

function saveSettings() {
  const kept = Object.fromEntries(REMEMBERED.map((key) => [key, settings[key]]));
  try { localStorage.setItem("jogPanel", JSON.stringify(kept)); } catch (e) { /* private mode */ }
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function say(text, tone) {
  const note = $("note");
  note.textContent = text;
  note.dataset.tone = tone;
}

function setText(node, text) {
  if (node.textContent !== text) node.textContent = text;
}

async function post(path, body = {}) {
  const res = await fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-Panel-Token": TOKEN},
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ---- Step and speed faders: each cap snaps to the detents the server accepts ----
const UNIT_WORDS = {
  "\u00b0": ["degree", "degrees"], "\u00b0/s": ["degree per second", "degrees per second"],
  " mm": ["millimetre", "millimetres"], " mm/s": ["millimetre per second", "millimetres per second"],
};

// The joints whose top speed is below a joint speed, grouped by top speed: printed "J1–2 max 84, J3 114.5" and
// spoken "limited to 84 for J1 and J2, 114.5 for J3". Empty when every joint can reach it.
function ratedLimits(speed) {
  const groups = [];
  CONFIG.jointRated.forEach((rated, i) => {
    if (rated >= speed) return;
    const last = groups[groups.length - 1];
    if (last && last.rated === rated && last.to === i - 1) last.to = i;
    else groups.push({from: i, to: i, rated});
  });
  if (!groups.length) return {printed: "", spoken: ""};
  const printed = groups.map((g, n) => {
    const name = g.from === g.to ? `J${g.from + 1}` : `J${g.from + 1}\u2013${g.to + 1}`;
    return `${name} ${n === 0 ? "max " : ""}${g.rated}`;
  });
  const spoken = groups.map((g) => {
    const names = [];
    for (let i = g.from; i <= g.to; i += 1) names.push(`J${i + 1}`);
    const who = names.length > 1 ? `${names.slice(0, -1).join(", ")} and ${names[names.length - 1]}` : names[0];
    return `${g.rated} for ${who}`;
  });
  return {printed: printed.join(", "), spoken: `limited to ${spoken.join(", ")}`};
}

// Where `line` falls along a fader's slot (0 to 1, the detents evenly spaced), or null past the top detent.
function slotAt(values, line) {
  if (line === null || !(line < values[values.length - 1])) return null;
  if (line <= values[0]) return 0;
  let i = 0;
  while (values[i + 1] <= line) i += 1;
  return (i + (line - values[i]) / (values[i + 1] - values[i])) / (values.length - 1);
}

const roundUp10 = (mmS) => Math.ceil(mmS / 10) * 10;
const dragging = () => Boolean(fader) || Boolean(view && view.isDragging());

// The joint speed fader's redline: the slowest joint speed at which the flange could pass the tool redline.
// With a plan staged, along that plan's path, where every joint turns in step with the lead joint within its
// rated speed; otherwise turning one joint alone from the arm's pose now; and until the pose is known, as if
// the arm were at full reach. Returns {line (deg/s, or null when nothing can), source, and what it came from}.
function jointRedline(s, planned) {
  const limit = CONFIG.toolRedline;
  if (planned) {
    const cap = cappedSpeed(Infinity, planned.travel).speed;
    const at = limit / planned.flangePerDeg;
    return {line: at < cap ? at : null, source: "plan", perDeg: planned.flangePerDeg, cap};
  }
  const known = Boolean(s && s.live && s.toolRadii);
  const radii = known ? s.toolRadii : CONFIG.jointRated.map(() => CONFIG.armReach);
  let line = null;
  radii.forEach((r, i) => {
    const at = r > 0 ? ((limit / r) * 180) / Math.PI : Infinity;
    if (at < (CONFIG.jointRated[i] ?? Infinity) && (line === null || at < line)) line = at;
  });
  return {line, source: known ? "pose" : "reach", radii};
}
let jointRed = jointRedline(null, null);
let planRed = null;  // a staged plan's own redline, for the plan bar's note

// How fast a joint speed would carry the flange (mm/s), and for a single joint, which one.
function flangeSpeed(red, speed) {
  if (red.source === "plan") return {mmS: Math.min(speed, red.cap) * red.perDeg, joint: null};
  let fastest = {mmS: 0, joint: 0};
  red.radii.forEach((r, i) => {
    const mmS = ((Math.min(speed, CONFIG.jointRated[i] ?? speed) * Math.PI) / 180) * r;
    if (mmS > fastest.mmS) fastest = {mmS, joint: i};
  });
  return fastest;
}

// The message line's account of a speed fader against its redline, in the red or out of it.
function redlineMessage(key, over) {
  const limit = CONFIG.toolRedline;
  if (key === "toolSpeed") {
    const v = settings.toolSpeed;
    return over ? `${v} mm/s is in the red: faster than the ${limit} mm/s limit for jogging by hand.`
      : `${v} mm/s is out of the red, within the ${limit} mm/s limit for jogging by hand.`;
  }
  const v = settings.jointSpeed;
  if (jointRed.source === "reach") {
    return over ? `${v}\u00b0/s is in the red: with the arm at full reach it could swing the flange past ${limit} mm/s, `
      + "the limit for jogging by hand." : `${v}\u00b0/s is out of the red.`;
  }
  const where = jointRed.source === "plan" ? "for this plan" : "here";
  if (!over) return `${v}\u00b0/s is out of the red ${where}: the flange stays under ${limit} mm/s.`;
  const fast = flangeSpeed(jointRed, v);
  const who = jointRed.source === "plan" ? "the move would carry the flange" : `J${fast.joint + 1} would swing the flange`;
  return `${v}\u00b0/s is in the red ${where}: ${who} at about ${roundUp10(fast.mmS)} mm/s, past the ${limit} mm/s `
    + "limit for jogging by hand.";
}

// Recolours a speed fader's value against its redline, and says so on the message line when the cap moves into
// or within the red, when the line moves past a resting cap (with the pose or a staged plan), when what the line
// measures changes under a cap in the red (a plan staged or cleared), and when it leaves the red. Not during a
// drag, when the plan bar says it. While a move is under way only the cap's own moves are reported, so the
// move's messages aren't overwritten as the line slides with the arm; a crossing made during the move is
// reported once the arm settles.
function checkRedline(f, moved) {
  const over = f.line !== null && settings[f.key] > f.line;
  const context = f.key === "jointSpeed" ? jointRed.source : "tool";
  f.show();
  const [was, wasContext] = [f.over, f.context];
  f.context = context;
  const s = status;
  const busy = !moved && (planSending || planSentAt || (s && s.live && (s.state === 1 || s.queued > 0)));
  if (was !== undefined && busy) return;
  f.over = over;
  if (was === undefined || dragging()) return;
  if (over && (moved || !was || context !== wasContext)) say(redlineMessage(f.key, true), "bad");
  else if (!over && was) say(redlineMessage(f.key, false), "ok");
}

// Hides a redline figure that would touch the scale's end figures or the rated-limits note.
function placeFigure(f) {
  const key = `${f.figure.textContent}|${f.figure.style.left}|${f.note ? f.note.textContent : ""}`;
  if (key === f.placedKey) return;
  f.placedKey = key;
  f.figure.style.visibility = "";
  if (!f.figure.textContent) return;
  const box = f.figure.getBoundingClientRect();
  const clash = [f.bottom, f.top, f.note].some((other) => {
    if (!other || !other.textContent) return false;
    const r = other.getBoundingClientRect();
    return box.left < r.right + 4 && r.left < box.right + 4;
  });
  if (clash) f.figure.style.visibility = "hidden";
}

// Moves a speed fader's red zone to `line` (deg/s or mm/s; null clears it): the rule, the ticks past it, the
// line's own figure in red at its start and the top figure, then the value.
function setRedline(f, line) {
  f.line = line;
  const at = slotAt(f.values, line);
  f.zone.hidden = at === null;
  const left = at === null ? "" : `${(at * 100).toFixed(1)}%`;
  if (f.zone.style.left !== left) f.zone.style.left = left;
  f.values.forEach((value, i) => f.ticks[i].classList.toggle("over", line !== null && value > line));
  f.top.classList.toggle("over", at !== null);
  setText(f.figure, at === null ? "" : line >= 10 ? String(Math.round(line)) : line.toFixed(1));
  const figureLeft = at === null ? "" : `calc(5.5px + (100% - 11px) * ${at.toFixed(3)})`;
  if (f.figure.style.left !== figureLeft) f.figure.style.left = figureLeft;
  checkRedline(f, false);
  placeFigure(f);
}

const faders = {};
for (const group of document.querySelectorAll(".detent")) {
  const key = group.dataset.setting;
  const unit = group.dataset.unit;
  const values = CHOICES[key];
  const input = el("input");
  Object.assign(input, {type: "range", id: `${key}Fader`, min: "0", max: String(values.length - 1), step: "1"});
  input.value = String(Math.max(0, values.indexOf(settings[key])));
  input.setAttribute("aria-label", group.dataset.name);
  const label = el("label", "legend", group.dataset.label);
  label.htmlFor = input.id;
  const ticks = el("span", "detent-ticks");
  const zone = el("span", "detent-red");
  zone.hidden = true;
  ticks.append(zone);
  const tickMarks = values.map((value, i) => {
    const tick = el("i", !REMEMBERED.includes(key) && value === CONFIG.defaults[key] ? "home" : "");
    tick.style.left = `${(i / (values.length - 1)) * 100}%`;
    ticks.append(tick);
    return tick;
  });
  const ends = el("span", "detent-ends");
  const bottom = el("span", "", String(values[0]));
  const top = el("span", "", String(values[values.length - 1]));
