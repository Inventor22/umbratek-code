  ticks.setAttribute("aria-hidden", "true");
  ends.setAttribute("aria-hidden", "true");
  const track = el("span", "detent-track");
  track.append(ticks, ends, input);
  const readout = el("output", "detent-value");
  readout.setAttribute("for", input.id);
  const f = {key, values, input, zone, ticks: tickMarks, bottom, top, note: limitNote, figure, line: null};
  f.show = () => {
    const value = values[Number(input.value)];
    const over = f.line !== null && value > f.line;
    setText(readout, `${value}${unit}`);
    readout.classList.toggle("over", over);
    const words = UNIT_WORDS[unit] ? UNIT_WORDS[unit][value === 1 ? 0 : 1] : unit.trim();
    let spoken = `${value} ${words}`;
    if (limitNote) {
      const limits = ratedLimits(value);
      setText(limitNote, limits.printed);
      if (limits.spoken) spoken += `, ${limits.spoken}`;
    }
    if (over) {
      spoken += key === "toolSpeed"
        ? `, in the red: faster than the ${CONFIG.toolRedline} millimetres per second limit for jogging by hand`
        : `, in the red: the flange could pass ${CONFIG.toolRedline} millimetres per second`;
    }
    if (input.getAttribute("aria-valuetext") !== spoken) input.setAttribute("aria-valuetext", spoken);
  };
  input.addEventListener("input", () => {
    settings[key] = values[Number(input.value)];
    saveSettings();
    checkRedline(f, true);
    placeFigure(f);
    render();
  });
  new ResizeObserver(() => {
    f.placedKey = null;
    placeFigure(f);
  }).observe(track);
  f.show();
  faders[key] = f;
  group.append(label, readout, track);
}
setRedline(faders.toolSpeed, CONFIG.toolRedline);
setRedline(faders.jointSpeed, jointRed.line);

// The speed a joint move runs at: the one chosen, unless that would turn a joint faster than its rated speed.
// A move turns every joint in step, the one with the furthest to go at the move's speed. The server applies
// the same cap. Returns {speed, joint}: the joint that limits it, or null.
function cappedSpeed(speed, travel) {
  const longest = Math.max(...travel);
  let sent = speed;
  let joint = null;
  travel.forEach((t, i) => {
    if (t <= 1e-6) return;
    const rated = CONFIG.jointRated[i] ?? Math.min(...CONFIG.jointRated);
    const cap = Math.floor(((rated * longest) / t) * 10) / 10;
    if (cap < sent) {
      sent = cap;
      joint = i;
    }
  });
  return {speed: sent, joint};
}

// ---- Jog keys: every press is sent, in order; refusals show on the key ----
const waiting = [];
let sending = false;

function refuse(key) {
  key.classList.remove("refused");
  void key.offsetWidth;  // restart the flash
  key.classList.add("refused");
  clearTimeout(key.refuseTimer);
  key.refuseTimer = setTimeout(() => key.classList.remove("refused"), 450);
}

function press(request, key, repeat) {
  if (!canJog) { refuse(key); return; }
  if (waiting.length >= MAX_WAITING_PRESSES) {
    if (!repeat) {
      refuse(key);
      say("Held back: earlier presses are still on their way to the arm.", "wait");
    }
    return;
  }
  waiting.push({request, key, repeat});
  pump();
}

async function pump() {
  if (sending) return;
  sending = true;
  while (waiting.length) {
    const {request, key, repeat} = waiting.shift();
    try {
      const reply = await post("/api/jog", request);
      say(reply.message, reply.ok ? (reply.moved ? "ok" : "wait") : "bad");
      if (!reply.ok || (!reply.moved && !repeat)) refuse(key);
    } catch (e) {
      say("The jog panel server isn't answering. Is jog_server.py still running?", "bad");
      refuse(key);
      waiting.length = 0;
    }
  }
  sending = false;
}

function bindJog(button, request) {
  let delay = 0;
  let repeat = 0;
  const release = () => {
    clearTimeout(delay);
    clearInterval(repeat);
    delay = repeat = 0;
    button.classList.remove("held");
  };
  button.addEventListener("pointerdown", (event) => {
    if (event.button !== 0 || button.disabled) return;
    event.preventDefault();
    button.setPointerCapture(event.pointerId);
    button.classList.add("held");
    press(request(), button, false);
    delay = setTimeout(() => {
      repeat = setInterval(() => press(request(), button, true), REPEAT_EVERY_MS);
    }, REPEAT_DELAY_MS);
  });
  for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) button.addEventListener(type, release);
  button.addEventListener("keydown", (event) => {
    if (event.key !== "Enter") return;
    event.preventDefault();
    if (!event.repeat) press(request(), button, false);
  });
  releases.push(release);
}
const releaseAll = () => releases.forEach((release) => release());
window.addEventListener("blur", releaseAll);
document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });

// ---- Joint strips ----
for (let i = 0; i < CONFIG.axis; i += 1) {
  const strip = el("article", "strip");
  strip.style.setProperty("--tape", `var(--tape-${i + 1})`);
  const scribble = el("header", "scribble");
  const act = el("span", "act");
  act.setAttribute("aria-hidden", "true");
  scribble.append(el("span", "", `J${i + 1}`), el("span", "name", JOINT_NAMES[i] || ""), act);
  const up = el("button", "key", "+");
  const down = el("button", "key", "\u2212");
  up.type = down.type = "button";
  up.setAttribute("aria-label", `Joint ${i + 1} plus one step`);
  down.setAttribute("aria-label", `Joint ${i + 1} minus one step`);
  const meter = el("div", "meter");
  meter.setAttribute("aria-hidden", "true");
  for (const [deg, text] of [[180, "180"], [90, "90"], [0, "0"], [-90, "\u221290"], [-180, "\u2212180"]]) {
    const scale = el("span", "scale", text);
    scale.style.top = `${((180 - deg) / 360) * 100}%`;
    if (deg === 180) scale.style.transform = "none";
    if (deg === -180) scale.style.transform = "translateY(-100%)";
    meter.append(scale);
  }
  const lit = el("span", "lit");
  const goal = el("span", "mark goal");
  const now = el("span", "mark now");
  lit.hidden = goal.hidden = now.hidden = true;
  meter.append(lit, goal, now);
  const lead = el("div", "lead");
  lead.setAttribute("aria-hidden", "true");
  const plusHalf = el("div", "half");
  const minusHalf = el("div", "half");
  for (let k = 0; k < CONFIG.maxLeadSteps; k += 1) {
    const plusStep = el("div", "step");
    const minusStep = el("div", "step");
    for (let j = 0; j < LEDS_PER_STEP; j += 1) {
      plusStep.append(el("i"));
      minusStep.append(el("i"));
    }
    plusHalf.append(plusStep);
    minusHalf.append(minusStep);
  }
  lead.append(plusHalf, el("div", "zero"), minusHalf);
  const meters = el("div", "meters");
  meters.append(meter, lead);
  const value = el("output", "value", "—");
  value.setAttribute("aria-label", `Joint ${i + 1} angle`);
  const toward = el("p", "toward", "");
  strip.append(scribble, up, meters, down, value, toward);
  $("strips").append(strip);
  bindJog(up, () => ({kind: "joint", index: i, dir: 1, step: settings.jointStep, speed: settings.jointSpeed}));
  bindJog(down, () => ({kind: "joint", index: i, dir: -1, step: settings.jointStep, speed: settings.jointSpeed}));
  meter.addEventListener("pointerdown", (event) => startFader(i, meter, event));
  meter.addEventListener("pointermove", (event) => moveFader(i, meter, event));
  meter.addEventListener("pointerleave", () => meter.classList.remove("near-cap"));
  for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
    meter.addEventListener(type, (event) => endFader(i, event, type !== "pointerup"));
  }
  strips.push({
    strip, meter, value, toward, lit, now, goal, keys: [up, down], leadShown: 0,
    plusLeds: [...plusHalf.querySelectorAll("i")].reverse(),  // nearest the centre line first
    minusLeds: [...minusHalf.querySelectorAll("i")],
  });
}

// ---- Planning: drag rings in the 3D view or joint fader caps to stage a pose; nothing moves until Move ----
function dragAllowed() {
  const s = status;
  return Boolean(CONFIG.model && canJog && s && !s.goal && s.state !== 1 && !s.queued && !planSending && !planSentAt
    && !(s.age > CONFIG.freshS));  // no new drag on a stale picture of the arm
}

function canMove() {
  return Boolean(plan && planCheck.clear && dragAllowed() && !fader && !(view && view.isDragging()));
}

function measuredPose() {
  const s = status;
  return s && s.live && s.joints.every(Number.isFinite) ? [...s.joints] : null;
}

const stagedJoints = (targets) => (targets ? targets.flatMap((q, i) => (Number.isFinite(q) ? [i] : [])) : []);

// What blocks a move, as the server words it: "the forearm would come within 10 mm of a cart brace".
const blockedBy = (hit) => (hit
  ? `${hit.part} would come within ${Math.round(CONFIG.collision.margin * 1000)} mm of ${hit.other}` : "it would collide");

// The plan with one joint staged at `angle`, or taken out when that's where the arm already is.
function withJoint(base, joint, angle, actual) {
  const next = base ? [...base] : Array(CONFIG.axis).fill(null);
  next[joint] = angle === null || (actual !== undefined && Math.abs(angle - actual) < DRAG_MIN_DEG) ? null : angle;
  return next.some(Number.isFinite) ? next : null;
}

// How close the pointer is to the fader cap (where the joint is) or, if staged, its frame (where it's planned).
function grabDistance(i, meter, event) {
  const pose = measuredPose();
  if (!pose) return Infinity;
  const rect = meter.getBoundingClientRect();
  const gap = (deg) => Math.abs(event.clientY - (rect.top + (percentFor(deg) / 100) * rect.height));
  return Math.min(gap(pose[i]), plan && Number.isFinite(plan[i]) ? gap(plan[i]) : Infinity);
}

function startFader(i, meter, event) {
  if (event.button !== 0 || fader || (view && view.isDragging()) || grabDistance(i, meter, event) > CAP_GRAB_PX) return;
  event.preventDefault();
  if (!dragAllowed()) {
    say(!CONFIG.model ? "Planning is off because the arm model didn't load. Use + and \u2212."
      : canJog ? "Wait for the arm to settle, then drag." : "Hold Enable before dragging a fader.", "wait");
    return;
  }
  meter.setPointerCapture(event.pointerId);
  const start = measuredPose();
  const planned = plan && Number.isFinite(plan[i]) ? plan[i] : start[i];
  fader = {joint: i, pointerId: event.pointerId, start, from: start[i], was: planned, to: planned, base: plan, plan};
  strips[i].strip.classList.add("dragging");
  moveFader(i, meter, event);
}

function moveFader(i, meter, event) {
  if (!fader) {
    meter.classList.toggle("near-cap", dragAllowed() && grabDistance(i, meter, event) <= CAP_GRAB_PX);
    return;
  }
  if (fader.joint !== i || event.pointerId !== fader.pointerId) return;
  const rect = meter.getBoundingClientRect();
  const snap = event.shiftKey ? 5 : DRAG_SNAP_DEG;
  const [low, high] = CONFIG.dragLimits[i];
  const raw = 180 - ((event.clientY - rect.top) / rect.height) * 360;
  fader.to = Math.min(high, Math.max(low, Math.round(raw / snap) * snap));
  fader.plan = withJoint(fader.base, i, fader.to);
  preview = {joint: i, to: fader.to};
  render();  // puts fader.plan on the shadow arm and checks it
  if (view) {
    const ring = view.labelPoint(i);  // the readout also shows in the monitor, beside that joint's ring
    if (ring) showTag({...ring, joint: i, from: fader.from, to: fader.to, clear: planCheck.clear, hit: planCheck.hit});
  }
}

function endFader(i, event, cancelled) {
  if (!fader || fader.joint !== i || event.pointerId !== fader.pointerId) return;
  const done = fader;
  fader = null;
  preview = null;
  strips[i].strip.classList.remove("dragging");
  showTag(null);
  stageDrop({joint: i, from: done.from, to: done.to, cancelled,
             changed: !cancelled && Math.abs(done.to - done.was) >= DRAG_MIN_DEG});
}

function cancelDrags() {
  const ring = Boolean(view && view.cancelDrag());
  const faderWas = fader;
  if (faderWas) endFader(faderWas.joint, {pointerId: faderWas.pointerId}, true);
  return ring || Boolean(faderWas);
}

// A drag ended: fold it into the plan. Nothing moves until Move.
function stageDrop(d) {
  if (d.cancelled) {
    say("Drag cancelled. The plan is unchanged.", "wait");
  } else if (d.kind === "tool") {
    if (d.changed) stageTool(d);
  } else if (d.changed) {
    plan = withJoint(plan, d.joint, d.to, d.from);
    const count = stagedJoints(plan).length;
    say(plan && Number.isFinite(plan[d.joint])
      ? `J${d.joint + 1} planned at ${d.to.toFixed(1)}\u00b0${count > 1 ? ` (${count} joints planned)` : ""}. `
        + "Press Move to go there, or Esc to clear the plan."
      : `J${d.joint + 1} is back where the arm is, so it's out of the plan.`, "ok");
  }
  render();
}

const signed = (x, digits) => `${x < 0 ? "\u2212" : "+"}${Math.abs(x).toFixed(digits)}`;

// A gizmo drag ended: the joint angles solved for it become the plan, every joint that turns.
function stageTool(d) {
  const actual = measuredPose();
  if (!actual) return;
  const next = d.pose.map((q, i) => (Math.abs(q - actual[i]) < 0.01 ? null : q));
  plan = next.some(Number.isFinite) ? next : null;
  const how = d.type === "move" ? `${signed(d.amount, 0)} mm along ${d.name}`
    : `${signed(d.amount, 1)}\u00b0 about ${d.name.slice(1).toUpperCase()}`;
  const count = stagedJoints(plan).length;
  say(plan ? `Tool planned ${how}, turning ${count} joint${count === 1 ? "" : "s"}. Press Move to go there, or Esc to clear the plan.`
    : "The tool is back where the arm is, so there's no plan.", "ok");
}

function clearPlan(text) {
  plan = null;
  planSentAt = 0;
  if (text) say(text, "wait");
  render();
}

// What dragging in the 3D view moves: each joint's ring, or the gizmo at the tool. Remembered on this PC.
function syncDragMode() {
  const tool = dragMode === "tool";
  $("modeJoints").setAttribute("aria-pressed", String(!tool));
  $("modeTool").setAttribute("aria-pressed", String(tool));
  $("dragSwatch").className = `swatch ${tool ? "gizmo" : "ring"}`;
  setText($("dragLegend"), tool ? "drag an arrow or ring" : "drag a ring");
}

function setDragMode(next) {
  if (next === dragMode) return;
  cancelDrags();
  dragMode = next;
  try { localStorage.setItem("jogPanelDrag", next); } catch (e) { /* private mode */ }
  syncDragMode();
  if (view) view.setMode(next);
  render();
}

// Why Move can't send the plan right now, for a refused press.
function whyNotMove() {
  const s = status;
  if (!planCheck.clear) return `Not moving: ${blockedBy(planCheck.hit)}.`;
  if (!s || !s.live) return "Not moving: there's no live status from the controller.";
  if (!canJog) return "Not moving: the motors aren't ready. Hold Enable first.";
  if (s.age > CONFIG.freshS) return "Not moving: waiting for fresh status from the controller.";
  if (planSentAt || s.goal || s.state === 1 || s.queued) return "Not moving: wait for the arm to settle.";
  return "Not moving: finish the drag first.";
}

// Send the whole plan as one move; it stays on screen until the status shows it as the goal.
async function movePlan() {
  if (!plan || planSending) return;
  if (!canMove()) {
    refuse($("planMove"));
    say(whyNotMove(), "bad");
    return;
  }
  planSending = true;
  render();
  try {
    const reply = await post("/api/move", {targets: plan, speed: settings.jointSpeed});
    say(reply.message, reply.ok ? "ok" : "bad");
    if (!reply.ok) refuse($("planMove"));
    if (reply.ok && reply.moved) planSentAt = performance.now();
    else if (reply.ok) plan = null;  // the arm is already there
  } catch (e) {
    say("The jog panel server isn't answering. Is jog_server.py still running?", "bad");
  } finally {
    planSending = false;
    render();
  }
}

// The plan bar: each staged joint (removable), what Move will do, and the Clear and Move keys.
let planKey = "";
function renderPlan(live) {
  const joints = stagedJoints(plan);
  $("plan").hidden = !joints.length;
  if (!joints.length) {
    planKey = "";
    return;
  }
  const s = status;
  const now = (i) => (live && Number.isFinite(s.joints[i]) ? `${s.joints[i].toFixed(1)}\u00b0` : "?");
  const key = joints.map((i) => `${i}:${plan[i].toFixed(1)}:${now(i)}`).join("|");
  if (key !== planKey) {
    planKey = key;
    $("planJoints").replaceChildren(...joints.map((i) => {
      const chip = el("li", "plan-chip");
      chip.style.setProperty("--tape", `var(--tape-${i + 1})`);
      const remove = el("button", "key unstage", "\u00d7");
      remove.type = "button";
      remove.dataset.joint = String(i);
      remove.setAttribute("aria-label", `Take J${i + 1} out of the plan`);
      const reading = el("span");
      reading.append(el("span", "from", `${now(i)} `), `\u2192 ${plan[i].toFixed(1)}\u00b0`);
      chip.append(el("span", "tag", `J${i + 1}`), reading, remove);
      return chip;
    }));
  }
  const names = joints.map((i) => `J${i + 1}`).join(", ");
  const travel = plan.map((q, i) => (Number.isFinite(q) && live ? Math.abs(q - s.joints[i]) : 0));
  const capped = cappedSpeed(settings.jointSpeed, travel);
  const pace = `${capped.speed}\u00b0/s${capped.joint !== null ? `, J${capped.joint + 1}'s top speed` : ""}`;
  const red = Boolean(planRed && planRed.line !== null) && settings.jointSpeed > planRed.line;
  const flange = red ? `; the flange would reach about ${roundUp10(flangeSpeed(planRed, settings.jointSpeed).mmS)} mm/s, `
    + `past the ${CONFIG.toolRedline} mm/s redline` : "";
  setText($("planNote"), planSending ? "Sending the plan\u2026" : planSentAt ? "Moving to the plan\u2026"
    : !planCheck.clear ? `Blocked: ${blockedBy(planCheck.hit)}.`
    : joints.length > 1 ? `Moves ${names} together, at up to ${pace}${flange}.`
    : `Moves ${names} at ${pace}${flange}.`);
  $("plan").classList.toggle("blocked", !planCheck.clear);
  $("plan").classList.toggle("over", red && planCheck.clear && !planSending && !planSentAt);
  $("planMove").disabled = planSending;
  $("planMove").setAttribute("aria-disabled", String(!canMove()));
  $("planClear").disabled = planSending || Boolean(planSentAt);
}
$("planJoints").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-joint]");
  if (!button || planSending || planSentAt) return;
  const i = Number(button.dataset.joint);
  plan = withJoint(plan, i, null);
  say(`J${i + 1} taken out of the plan.`, "wait");
  render();
});
$("planClear").addEventListener("click", () => clearPlan("Plan cleared. The arm didn't move."));
$("planMove").addEventListener("click", movePlan);

function showTag(p) {
  const tag = $("screenTag");
  if (!p) {
    tag.hidden = true;
    return;
  }
  tag.hidden = false;
  tag.dataset.tone = p.clear ? "ok" : "blocked";
  if (p.kind === "tool") {
    const how = !p.clear ? `Blocked: ${blockedBy(p.hit)}`
      : p.limited ? `${p.limited}, so it stops here` : "Release to plan \u00b7 Esc cancels";
    if (p.type === "move") {
      // In the controller's terms: the model's position plus how far the controller's reported pose sits from
      // the model's for the arm as it is (nothing on this arm).
      const s = status;
      const offset = s && s.live && kinematics ? s.pose[p.axis] - kinematics.solver.pose(s.joints).p[p.axis] * 1000 : 0;
      const from = p.from + offset;
      tag.replaceChildren(`${p.name}  ${from.toFixed(1)} mm `, el("span", "to", `\u2192 ${(from + p.amount).toFixed(1)} mm`),
        el("span", "how", how));
    } else {
      tag.replaceChildren(`${p.name}  `, el("span", "to", `${signed(p.amount, 1)}\u00b0`), el("span", "how", how));
    }
  } else {
    const how = !p.clear ? `Blocked: ${blockedBy(p.hit)}`
      : p.limited ? `J${p.joint + 1} stops at ${p.to.toFixed(0)}\u00b0` : "Release to plan \u00b7 Esc cancels";
    tag.replaceChildren(`J${p.joint + 1}  ${p.from.toFixed(1)}\u00b0 `, el("span", "to", `\u2192 ${p.to.toFixed(1)}\u00b0`),
      el("span", "how", how));
  }
  placeTag(tag, p);
}

// Sets the readout outward from the ring's or gizmo's centre (cx, cy), at or past (x, y), on the side it's
// pushed toward, and keeps it on screen. For a gizmo, when that side has no room, it goes above or below
// instead, clear of the gizmo, so it never covers the handle being dragged.
function placeTag(tag, p) {
  const rect = $("screen").getBoundingClientRect();
  const width = tag.offsetWidth;
  const height = tag.offsetHeight;
  let dx = p.x - (p.cx ?? p.x - 1);
  let dy = p.y - (p.cy ?? p.y);
  const reach = Math.hypot(dx, dy) || 1;
  dx /= reach;
  dy /= reach;
  const x = p.x - rect.left + dx * 34;
  const y = p.y - rect.top + dy * 34;
  const fits = {right: x + width <= rect.width - 8, left: x - width >= 8};
  let side = dx < 0 ? "left" : "right";
  if (!fits[side]) side = side === "right" ? "left" : "right";
  let left = side === "right" ? x : x - width;
  let top = y - height / 2;
  if (p.kind === "tool" && !(fits.right && dx >= 0) && !(fits.left && dx < 0)) {
    // No room beside the gizmo on the pointer's side: centre it above or below, past the letters.
    const cx = p.cx - rect.left;
    const cy = p.cy - rect.top;
    const clearance = 120;
    const below = cy + clearance + height <= rect.height - 8;
    left = cx - width / 2;
    top = (dy >= 0 && below) || cy - clearance - height < 8 ? cy + clearance : cy - clearance - height;
  }
  left = Math.min(rect.width - 8 - width, Math.max(8, left));
  top = Math.min(rect.height - 8 - height, Math.max(8, top));
  tag.style.left = `${left}px`;
  tag.style.top = `${top}px`;
}

// ---- Tool axes ----
TOOL_AXES.forEach((axis, i) => {
  if (i === 0) $("axes").append(el("p", "axis-group", "Position"));
  if (i === 3) $("axes").append(el("p", "axis-group", "Orientation"));
  const row = el("div", "axis");
  const minus = el("button", "key", "\u2212");
  const plus = el("button", "key", "+");
  minus.type = plus.type = "button";
  minus.setAttribute("aria-label", `${axis.name} minus one step`);
  plus.setAttribute("aria-label", `${axis.name} plus one step`);
  const reading = el("div", "reading");
  const value = el("output", "value", "—");
  value.setAttribute("aria-label", `Tool ${axis.name}`);
  const toward = el("span", "toward", "");
  reading.append(value, toward);
  row.append(el("span", "axis-name", axis.name), minus, reading, plus);
  $("axes").append(row);
  const request = (dir) => () => ({kind: "tool", index: i, dir, step: settings.toolStep,
                                   rotStep: settings.rotStep, speed: settings.toolSpeed});
  bindJog(minus, request(-1));
  bindJog(plus, request(1));
  axes.push({row, value, toward, unit: axis.unit, keys: [minus, plus]});
});

// ---- STOP: fires on press, from the key, Space or Esc ----
async function stopArm() {
  releaseAll();
  cancelDrags();
  plan = null;  // after a stop, plan again from where the arm ended up
  planSentAt = 0;
  waiting.length = 0;
  const key = $("stopKey");
  key.classList.add("fired");
  say("Stopping…", "wait");
  try {
    const reply = await post("/api/stop");
    say(reply.message, reply.ok ? "ok" : "bad");
    localStopAlarm = !reply.ok;
  } catch (e) {
    say("Couldn't reach the jog panel server. Press the hardware E-stop.", "bad");
    localStopAlarm = true;
  } finally {
    setTimeout(() => key.classList.remove("fired"), 250);
    render();
  }
}
$("stopKey").addEventListener("pointerdown", (event) => {
  if (event.button !== 0) return;
  event.preventDefault();
  stopArm();
});
$("stopKey").addEventListener("keydown", (event) => {
  if (event.key !== "Enter") return;
  event.preventDefault();
  if (!event.repeat) stopArm();
});
document.addEventListener("keydown", (event) => {
  if (event.key !== " " && event.key !== "Escape") return;
  event.preventDefault();
  event.stopPropagation();
  if (event.repeat) return;
  // Space always stops. Esc backs out one level: a drag in progress, then the plan; with nothing to back
  // out of, or with the arm moving, it stops too.
  const s = status;
  const moving = Boolean(s && (s.state === 1 || s.goal || s.queued));
  const cancelled = cancelDrags();
  if (event.key === " " || moving) {
    stopArm();
  } else if (!cancelled) {
    if (plan && !planSending && !planSentAt) clearPlan("Plan cleared. The arm didn't move.");
    else stopArm();
  }
}, true);
window.addEventListener("blur", cancelDrags);
document.addEventListener("visibilitychange", () => { if (document.hidden) cancelDrags(); });

// ---- Enable: hold until the bar fills ----
const enableKey = $("enableKey");
let holdTimer = 0;
function beginHold() {
  if (enableKey.disabled || holdTimer) return;
  enableKey.classList.add("charging");
  holdTimer = setTimeout(async () => {
    holdTimer = 0;
    enableKey.classList.remove("charging");
    enableKey.classList.add("busy");
    say("Switching the motors on…", "wait");
    try {
      const reply = await post("/api/enable");
      say(reply.message, reply.ok ? "ok" : "bad");
    } catch (e) {
      say("The jog panel server isn't answering. Is jog_server.py still running?", "bad");
    } finally {
      enableKey.classList.remove("busy");
    }
  }, HOLD_TO_ENABLE_MS);
}
function endHold() {
  if (holdTimer) {
    clearTimeout(holdTimer);
    holdTimer = 0;
    say("Keep holding Enable until the green bar fills.", "wait");
  }
  enableKey.classList.remove("charging");
}
enableKey.addEventListener("pointerdown", (event) => {
  if (event.button !== 0) return;
  event.preventDefault();
  enableKey.setPointerCapture(event.pointerId);
  beginHold();
});
for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) enableKey.addEventListener(type, endHold);
enableKey.addEventListener("keydown", (event) => {
  if (event.key !== "Enter") return;
  event.preventDefault();
  if (!event.repeat) beginHold();
});
enableKey.addEventListener("keyup", (event) => { if (event.key === "Enter") endHold(); });

// ---- Rendering ----
const percentFor = (deg) => ((180 - Math.max(-180, Math.min(180, deg))) / 360) * 100;

function place(mark, deg) {
  if (deg === null || deg === undefined) { mark.hidden = true; return; }
  mark.hidden = false;
  mark.style.top = `${percentFor(deg)}%`;
  mark.classList.toggle("over", Math.abs(deg) > 180);
}

function fill(lit, deg) {
  if (deg === null || deg === undefined) { lit.hidden = true; return; }
  lit.hidden = false;
  const a = percentFor(deg);
  const zero = percentFor(0);
  lit.style.clipPath = `inset(${Math.min(a, zero)}% 0 ${100 - Math.max(a, zero)}% 0)`;
}

// Light LEDS_PER_STEP lead lights per step of gap between the commanded goal and the joint.
function showLead(st, gap) {
  const count = gap === null ? 0 : Math.min(st.plusLeds.length,
    Math.max(1, Math.ceil((Math.abs(gap) * LEDS_PER_STEP) / settings.jointStep - 1e-6)));
  const shown = gap === null ? 0 : Math.sign(gap) * count;
  if (shown === st.leadShown) return;
  st.leadShown = shown;
  st.plusLeds.forEach((led, n) => led.classList.toggle("on", shown > 0 && n < count));
  st.minusLeds.forEach((led, n) => led.classList.toggle("on", shown < 0 && n < count));
}

function describe(s) {
  if ((s && s.stopAlarm) || localStopAlarm) {
    return ["STOP NOT CONFIRMED", "The controller didn't confirm the stop. Press the hardware E-stop now.", "alarm"];
  }
  if (!s && !settled) return ["CONNECTING", "Waiting for the jog panel server.", "idle"];
  if (!s) return ["NO SIGNAL", `The jog panel server isn't answering. Start it with: python scripts/jog_server.py ${CONFIG.ip}`, "alarm"];
  if (!s.live) return ["NO SIGNAL", `No status from the controller at ${s.ip}. Check the Wi-Fi link.`, "alarm"];
  if (s.err === 1) return ["E-STOP", "An emergency stop is active. Release it, then hold Enable.", "alarm"];
  if (s.err) return ["FAULT", `Error ${s.err} (${s.errName}). Fix the cause, then hold Enable.`, "alarm"];
  if (!s.enabled) return ["MOTORS OFF", "Hold Enable to switch the motors on.", "idle"];
  if (s.state === 4) return ["STOPPED", "The arm is stopped. Hold Enable to make it ready again.", "stopped"];
  if (s.state === 3) return ["PAUSED", "Press STOP to clear the paused move, then hold Enable.", "stopped"];
  if (s.state === 1 || s.goal) {
    const queued = s.queued > 0 ? ` ${s.queued} more queued.` : "";
    return ["MOVING", `Heading for the commanded position.${queued}`, "moving"];
  }
  // With a pose staged, the sentence follows the plan.
  const joints = stagedJoints(fader ? fader.plan : plan);
  if (joints.length && !planSentAt) {
    if (!planCheck.clear) {
      const by = planCheck.hit ? planCheck.hit.other : "something";
      return ["READY", `The plan is blocked by ${by}. Change it, or press Esc to clear.`, "ready"];
    }
    const names = joints.map((i) => `J${i + 1}`).join(", ");
    return ["READY", `${names} planned. Press Move to send ${joints.length > 1 ? "them" : "it"}, or Esc to clear.`, "ready"];
  }
  return ["READY", "Click a key for one step, or drag in the 3D view or a joint's fader cap to plan a pose, then press Move.", "ready"];
}

// The controller's status stream stalls now and then; say so rather than show a stale picture as current.
function describeWithAge(s) {
  const [name, detail, tone] = describe(s);
  if (s && s.live && s.age > CONFIG.freshS && tone !== "alarm") {
    return [name, `Status is ${s.age.toFixed(1)} s old (the Wi-Fi link stalls now and then). Moves wait for fresh status.`, tone];
  }
  return [name, detail, tone];
}

function render() {
  const s = status;
  const live = Boolean(s && s.live);
  if (localStopAlarm && live && !s.stopAlarm && (s.state === 4 || !s.enabled || s.err)) localStopAlarm = false;
  const slow = live && s.age > CONFIG.freshS;  // the controller's status stream stalls now and then
  $("linkLed").dataset.on = live ? (slow ? "slow" : "live") : s || settled ? "dead" : "";
  setText($("linkText"), live ? `Live · ${s.ip}${slow ? ` · status ${s.age.toFixed(1)} s old` : ""}`
    : s ? `No status from ${s.ip}` : settled ? "Jog server not answering" : "Connecting…");

  canJog = live && !s.err && s.enabled && [0, 1, 2].includes(s.state) && !s.stopAlarm && !localStopAlarm;
  if (!canJog && (fader || (view && view.isDragging()))) cancelDrags();  // the arm can't take a move now
  const goal = s && s.goal ? s.goal : null;
  const jointGoal = goal && goal.kind === "joint" ? goal.values : null;
  // A sent plan hands over to the goal once the status reports it (or after a moment, for a tiny move).
  if (planSentAt && (jointGoal || performance.now() - planSentAt > 1500)) {
    plan = null;
    planSentAt = 0;
  }
  const shownPlan = fader ? fader.plan : plan;
  if (view) {
    if (live) view.setActual(s.joints);
    view.setGoal(jointGoal);
    planCheck = view.setPlan(shownPlan);
  } else {
    planCheck = {clear: true, hit: null};  // the server still checks every plan
  }
  // The joint speed redline: the lower of a staged plan's and the arm's pose's, since the ± keys still jog one
  // joint at this speed while a plan waits.
  const travel = shownPlan && live ? shownPlan.map((q, i) => (Number.isFinite(q) ? Math.abs(q - s.joints[i]) : 0)) : null;
  const poseRed = jointRedline(s, null);
  planRed = travel && planCheck.flangePerDeg > 0 ? jointRedline(s, {travel, flangePerDeg: planCheck.flangePerDeg}) : null;
  jointRed = planRed && planRed.line !== null && (poseRed.line === null || planRed.line < poseRed.line) ? planRed : poseRed;
  setRedline(faders.jointSpeed, jointRed.line);

  // The state window, after the plan check: with a pose staged, its sentence follows the plan.
  const [name, detail, tone] = describeWithAge(s);
  setText($("stateName"), name);
  setText($("stateDetail"), detail);
  // A stale picture keeps its word but loses its light, so a glance doesn't read it as current.
  $("stateWindow").dataset.tone = slow && tone !== "alarm" ? "idle" : tone;
  const canDrag = dragAllowed();
  if (view) view.setInteractive(canDrag && !fader);
  const help = $("screenHelp");
  help.hidden = !view || Boolean(plan);
  const tool = dragMode === "tool";
  setText(help, canDrag ? (tool
    ? "Drag an arrow to slide the tool or a ring to turn it; the joints follow, and nothing moves until you press Move. Shift snaps to 10 mm or 5\u00b0."
    : "Drag rings to plan a pose; nothing moves until you press Move. Shift snaps to 5\u00b0. Drag elsewhere to turn the view.")
    : slow ? `Waiting for fresh status from the controller before ${tool ? "the gizmo unlocks" : "the rings unlock"}.`
    : canJog ? `${tool ? "The gizmo unlocks" : "The rings unlock"} once the arm has settled.`
    : `Hold Enable to use ${tool ? "the gizmo" : "the rings"}.`);

  strips.forEach((st, i) => {
    const deg = live ? s.joints[i] : null;
    const target = jointGoal ? jointGoal[i] : null;
    const moving = deg !== null && target !== null && Math.abs(target - deg) > 0.05;
    // A ring or fader drag previews one joint; a gizmo drag previews them all.
    const pv = preview && (preview.pose || preview.joint === i) ? preview : null;
    const planned = shownPlan && Number.isFinite(shownPlan[i]) ? shownPlan[i] : null;
    const clear = pv && pv.clear !== undefined ? pv.clear : planCheck.clear;
    const previewed = pv && pv.pose ? (deg !== null && Math.abs(pv.pose[i] - deg) > 0.05 ? pv.pose[i] : null) : pv ? pv.to : null;
    const aim = pv ? previewed : planned;  // where a drag or the plan has this joint going
    setText(st.value, deg === null ? "—" : `${deg.toFixed(2)}°`);
    if (aim !== null) {
      setText(st.toward, clear ? `→ ${aim.toFixed(1)}°` : "Blocked");
    } else {
      setText(st.toward, moving ? `→ ${target.toFixed(2)}°` : "");
    }
    st.toward.classList.toggle("blocked", aim !== null && !clear);
    st.goal.classList.toggle("blocked", aim !== null && !clear);
    // Staged but not sent: dashed and grey. A drag in progress stays amber, like a held key.
    st.toward.classList.toggle("planned", aim !== null && !pv);
    st.goal.classList.toggle("planned", aim !== null && !pv);
    fill(st.lit, deg);
    place(st.now, deg);
    place(st.goal, aim !== null ? aim : moving ? target : null);
    showLead(st, aim === null && moving ? target - deg : null);
    st.strip.classList.toggle("moving", moving);
    if (!canDrag) st.meter.classList.remove("near-cap");
    for (const key of st.keys) key.disabled = !canJog;
  });
  renderPlan(live);

  // The tool's pose for the joints a drag or the plan has staged, in the controller's terms (mm and roll,
  // pitch, yaw), so the tool rows show where a plan would put it, whichever way it was made. It's the model's
  // change from the arm's pose now, applied to the pose the controller reports (on this arm the two agree).
  let toolPlan = null;
  if (live && kinematics) {
    let staged = s.joints.map((q, i) => (shownPlan && Number.isFinite(shownPlan[i]) ? shownPlan[i] : q));
    if (preview && preview.pose) staged = preview.pose;
    else if (preview && Number.isFinite(preview.to)) staged[preview.joint] = preview.to;
    if (staged.some((q, i) => Math.abs(q - s.joints[i]) > 1e-6)) {
      const {solver, rpy, fromRpy, multiply} = kinematics;
      const now = solver.pose(s.joints);
      const then = solver.pose(staged);
      const turn = multiply(then.R, now.R.map((_, i) => now.R.map((row) => row[i])));  // then.R * now.R^T
      toolPlan = [...then.p.map((v, i) => s.pose[i] + (v - now.p[i]) * 1000),
                  ...rpy(multiply(turn, fromRpy(s.pose[3], s.pose[4], s.pose[5])))];
    }
  }
  const wrapDeg = (a) => ((a + 540) % 360) - 180;
  axes.forEach((ax, i) => {
    const value = live ? s.pose[i] : null;
    const target = goal && goal.kind === "tool" ? goal.values[i] : null;
    let gap = target !== null && value !== null ? target - value : 0;
    if (ax.unit === "°") gap = wrapDeg(gap);
    const moving = Math.abs(gap) > 0.05;
    const unit = ax.unit === "°" ? "°" : " mm";
    const planned = !moving && toolPlan && value !== null
      && Math.abs(ax.unit === "°" ? wrapDeg(toolPlan[i] - value) : toolPlan[i] - value) > 0.05 ? toolPlan[i] : null;
    setText(ax.value, value === null ? "—" : `${value.toFixed(1)}${unit}`);
    setText(ax.toward, moving ? `→ ${target.toFixed(1)}${unit}` : planned !== null ? `→ ${planned.toFixed(1)}${unit}` : "");
    ax.toward.classList.toggle("planned", planned !== null && !preview);  // amber while a drag is on
    ax.row.classList.toggle("moving", moving);
    for (const key of ax.keys) key.disabled = !canJog;
  });

  const alarm = Boolean((s && s.stopAlarm) || localStopAlarm);
  enableKey.disabled = !live || alarm;
  const ready = live && !alarm && s.enabled && !s.err && s.state !== 3 && s.state !== 4;
  enableKey.classList.toggle("on", ready);
  setText($("enableLabel"), ready ? "Motors on" : "Hold to enable");
  setText($("enableSub"), alarm ? "Locked: use the E-stop" : ready ? "Hold again to reset" : "Hold for 0.7 s");

  if (s && s.note !== lastServerNote) {
    lastServerNote = s.note;
    say(s.note, s.noteOk ? "ok" : "bad");
  }
}

let failedPolls = 0;
async function poll() {
  try {
    const res = await fetch("/api/status", {cache: "no-store"});
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    status = await res.json();
    failedPolls = 0;
    settled = true;
  } catch (e) {
    failedPolls += 1;
    if (failedPolls >= 3) {  // ride out a single dropped request
      status = null;
      settled = true;
    }
  }
  render();
  setTimeout(poll, POLL_MS);
}

setText($("hint"), `Click + or \u2212 for one step; holding repeats, up to ${CONFIG.maxLeadSteps} steps ahead. `
  + "Drag in the 3D view or a joint's fader cap to plan a pose, then press Move.");

// ---- 3D monitor ----
$("viewReset").disabled = true;
$("viewReset").addEventListener("click", () => { if (view) view.resetView(); });
for (const key of [$("modeJoints"), $("modeTool")]) key.disabled = true;  // until the 3D view is up
$("modeJoints").addEventListener("click", () => setDragMode("joints"));
$("modeTool").addEventListener("click", () => setDragMode("tool"));
if (CONFIG.model && CONFIG.three) {
  const css = getComputedStyle(document.documentElement);
  import("/web/arm_view.js")
    .then(({createArmView}) => createArmView($("screen"), {
      modelBase: CONFIG.model.base,
      urdfFile: CONFIG.model.urdf,
      tapes: strips.map((_, i) => css.getPropertyValue(`--tape-${i + 1}`).trim()),
      limits: CONFIG.dragLimits,
      collision: CONFIG.collision,
      cart: CONFIG.cart,
      floorZ: CONFIG.floorZ,
      mode: dragMode,
      onPreview(p) {
        preview = p && (p.kind === "tool" ? {pose: p.pose, clear: p.clear} : {joint: p.joint, to: p.to, clear: p.clear});
        showTag(p);
        render();
      },
      onRelease: stageDrop,
      onLost() {
        $("screenNote").hidden = false;
        setText($("screenNote"), "The 3D view stopped because the graphics driver reset. Reload the page to bring it back.");
      },
    }))
    .then((created) => {
      view = created;
      $("screenNote").hidden = true;
      $("viewReset").disabled = false;
      for (const key of [$("modeJoints"), $("modeTool")]) key.disabled = false;
      render();
    })
    .catch((error) => {
      setText($("screenNote"), `The 3D view couldn't start (${error.message}). The keys and faders still work.`);
    });
} else if (CONFIG.model) {
  setText($("screenNote"), "No 3D view: it needs three.js, which the jog panel server downloads the first time it runs, "
    + "and the download failed (the server's window says why). Check this PC can reach the internet, then start the "
    + "server again. The keys and faders still work.");
} else {
  setText($("screenNote"), "The arm model didn't load, so there's no 3D view and drag moves are off. The + and \u2212 keys still work.");
}
// The same kinematics, for the tool rows' planned pose; they work without the 3D view.
if (CONFIG.model) {
  import("/web/ik.js")
    .then(({createSolver, rpy, fromRpy, multiply}) => {
      kinematics = {solver: createSolver(CONFIG.collision), rpy, fromRpy, multiply};
      render();
    })
    .catch(() => { /* the tool rows just won't show a planned pose */ });
}

syncDragMode();
render();
poll();
</script>
</body>
